AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: Local SAM template for the backend Lambda + HTTP API

Resources:
  BackendApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      CorsConfiguration:
        AllowOrigins:
          - "*"
        AllowMethods:
          - GET
          - POST
          - DELETE
          - OPTIONS
        AllowHeaders:
          - "*"

  BackendFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: src/app.handler
      Runtime: python3.12
      Timeout: 10
      MemorySize: 256
      Environment:
        Variables:
          MONGODB_URI: "mongodb+srv://<USERNAME>:<PASSWORD>@aws-fullstack-serverles.n8copxl.mongodb.net"
          MONGODB_DB: "sample_mflix"
      Events:
        Root:
          Type: HttpApi
          Properties:
            ApiId: !Ref BackendApi
            Method: GET
            Path: /
        Movies:
          Type: HttpApi
          Properties:
            ApiId: !Ref BackendApi
            Method: GET
            Path: /movies
        MovieById:
          Type: HttpApi
          Properties:
            ApiId: !Ref BackendApi
            Method: GET
            Path: /movies/{id}
        Favorites:
          Type: HttpApi
          Properties:
            ApiId: !Ref BackendApi
            Method: GET
            Path: /favorites
        FavoriteIds:
          Type: HttpApi
          Properties:
            ApiId: !Ref BackendApi
            Method: GET
            Path: /favorites/ids
        FavoriteCreate:
          Type: HttpApi
          Properties:
            ApiId: !Ref BackendApi
            Method: POST
            Path: /favorites
        FavoriteDelete:
          Type: HttpApi
          Properties:
            ApiId: !Ref BackendApi
            Method: DELETE
            Path: /favorites/{id}
