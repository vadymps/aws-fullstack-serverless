<main class="card">
  <div class="profile-header">
    <div class="profile-avatar">JD</div>
    <div>
      <h1>Jane Doe</h1>
      <p class="muted">jane.doe&#64;example.com</p>
    </div>
  </div>

  <section class="profile-details">
    <div>
      <h2>Account</h2>
      <p class="muted">Active since 2024</p>
    </div>
    <div>
      <h2>Plan</h2>
      <p class="muted">Free</p>
    </div>
  </section>

  <div class="profile-actions">
    <button mat-raised-button color="primary" type="button" (click)="login()">
      Sign in
    </button>
  </div>
</main>
