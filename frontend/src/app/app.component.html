<mat-sidenav-container class="app-shell">
  <mat-sidenav
    #drawer
    class="app-sidenav"
    [mode]="isHandset() ? 'over' : 'side'"
    [opened]="!isHandset()"
    [disableClose]="!isHandset()"
  >
    <nav class="sidenav-content">
      <a mat-button routerLink="/movies" (click)="closeDrawerOnNavigate(drawer)">Movies</a>
      <a mat-button routerLink="/profile" (click)="closeDrawerOnNavigate(drawer)">Profile</a>
    </nav>
  </mat-sidenav>

  <mat-sidenav-content class="app-content">
    <app-header [showMenu]="isHandset()" (menuClick)="drawer.toggle()"></app-header>

    <main class="app-main">
      <router-outlet></router-outlet>
    </main>

    <app-footer></app-footer>
  </mat-sidenav-content>
</mat-sidenav-container>
