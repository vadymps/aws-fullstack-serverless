<div class="app-shell">
  <aside class="app-sidenav" [class.app-sidenav--hidden]="isHandset()">
    <nav class="sidenav-content">
      <a class="nav-link" routerLink="/movies" (click)="handleNavClick()">Movies</a>
      <a class="nav-link" routerLink="/favorites" (click)="handleNavClick()">Favorites</a>
      <a class="nav-link" routerLink="/profile" (click)="handleNavClick()">Profile</a>
      <a class="nav-link" routerLink="/about" (click)="handleNavClick()">About</a>
    </nav>
  </aside>

  <div class="app-content">
    <app-header [showMenu]="isHandset()" (menuClick)="toggleMenu()"></app-header>

    <main class="app-main">
      <router-outlet></router-outlet>
    </main>

    <app-footer></app-footer>
  </div>

  @if (isHandset()) {
    <div
      class="mobile-backdrop"
      [class.mobile-backdrop--open]="menuOpen()"
      (click)="closeMenu()"
    ></div>
    <aside class="mobile-drawer" [class.mobile-drawer--open]="menuOpen()">
      <nav class="sidenav-content">
        <a class="nav-link" routerLink="/movies" (click)="handleNavClick()">Movies</a>
        <a class="nav-link" routerLink="/favorites" (click)="handleNavClick()">Favorites</a>
        <a class="nav-link" routerLink="/profile" (click)="handleNavClick()">Profile</a>
        <a class="nav-link" routerLink="/about" (click)="handleNavClick()">About</a>
      </nav>
    </aside>
  }
</div>
